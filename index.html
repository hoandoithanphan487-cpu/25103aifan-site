<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>25103 AI Fan</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #725cff 0, transparent 35%),
        radial-gradient(circle at 80% 80%, #00b8a9 0, transparent 35%),
        #10131c;
    }

    main {
      width: min(680px, 100%);
      padding: 56px 40px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 28px;
      background: rgba(255,255,255,.09);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(18px);
    }

    .label {
      display: inline-block;
      padding: 8px 14px;
      color: #b9fff7;
      border: 1px solid rgba(185,255,247,.4);
      border-radius: 999px;
      font-size: 14px;
    }

    h1 {
      margin: 24px 0 16px;
      font-size: clamp(38px, 8vw, 72px);
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: #cbd0df;
      font-size: 18px;
      line-height: 1.8;
    }

    footer {
      margin-top: 36px;
      color: #8f96aa;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <span class="label">25103aifan.com</span>
    <h1>你好，欢迎来到我的网站</h1>
    <p>网站正在建设中，很快会有新的内容。</p>
    <footer>© 2026 · 25103 AI Fan</footer>
  </main>
</body>
</html>
